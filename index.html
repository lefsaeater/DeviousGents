<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Devious Gents. Our new home on the web.">
    <meta name="color-scheme" content="dark">
    <title>The Devious Gents</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #141719;
        color: #f5f0e7;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        width: 100%;
        max-width: 48rem;
        padding: clamp(2rem, 7vw, 5rem) 0;
        border-top: 2px solid #c9a86c;
        border-bottom: 1px solid #5b5140;
      }
      .eyebrow {
        color: #c9a86c;
        font: 0.8rem/1.5 system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1.5rem 0;
        font-size: clamp(2.5rem, 9vw, 5.5rem);
        line-height: 1.05;
        font-weight: normal;
      }
      .intro {
        color: #d3cec5;
        font: 1.125rem/1.7 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Welcome to</p>
      <h1>The Devious Gents</h1>
      <p class="intro">Our new home on the web. More coming soon.</p>
    </main>
  </body>
</html>
